# ============================================================
# Vayudrishti-AI — Maharashtra Region Configuration
# ============================================================
region_name: "Maharashtra"
state_code: "MH"
country: "India"

# Bounding box for Maharashtra (WGS-84, decimal degrees)
# Covers 15.6°N to 22.1°N latitude, 72.6°E to 80.9°E longitude (~308,000 km²)
bbox:
  lat_min: 15.60
  lat_max: 22.10
  lon_min: 72.60
  lon_max: 80.90

# Grid specifications for statewide raster surface
grid:
  resolution_deg: 0.01          # ~1.0 km nominal resolution
  overview_resolution_deg: 0.05 # ~5 km for rapid preview rendering
  raster_width_px: 830
  raster_height_px: 650

